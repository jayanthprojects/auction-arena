<style>
:root{--bg:#eef0f6;--cd:#fff;--tx:#12203f;--mu:#667;--ac:#e39b00;--bd:#d5d9e6;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1126;--cd:#141d3b;--tx:#eef1ff;--mu:#9aa6c8;--ac:#ffc933;--bd:#27345f;--ok:#4ade80}}
:root[data-theme=dark]{--bg:#0a1126;--cd:#141d3b;--tx:#eef1ff;--mu:#9aa6c8;--ac:#ffc933;--bd:#27345f;--ok:#4ade80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;padding:12px 16px;background:linear-gradient(90deg,#0b1f55,#2347a8);color:#fff;font-weight:800}
#app{max-width:1100px;margin:auto;padding:14px}.g{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media(max-width:800px){.g{grid-template-columns:1fr}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}.c{text-align:center}
h1,h2,h3{margin:.2em 0}.mu,small{color:var(--mu)}.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bd);font-size:12px;margin:2px}.os{background:#e11d48;color:#fff}.tg{background:var(--ac);color:#111}
.btn,.sm,select{font:inherit;border:0;border-radius:10px;background:var(--ac);color:#111;font-weight:700;padding:10px 16px;cursor:pointer;margin:3px}.sm{padding:3px 9px;background:var(--bd);color:var(--tx)}.sm.sel{background:var(--ac);color:#111}select{padding:3px;background:var(--bd);color:var(--tx)}
.btn.big{width:100%;font-size:22px;padding:16px;animation:pulse 1.4s infinite}button:disabled{opacity:.4;animation:none;cursor:not-allowed}input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:3px}
.pl{display:flex;gap:14px;align-items:center;margin:10px 0;animation:slide .5s}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--ac);overflow:hidden;background:#222}
.av svg{width:100%;height:100%;display:block}
.bidbox{text-align:center;margin:8px 0}.amt{font-size:46px;font-weight:900;color:var(--ac);animation:pop .4s}.ld{font-weight:800;font-size:18px}
.bar{height:14px;border-radius:9px;background:var(--bd);margin:10px 0;position:relative}.bar i{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .25s linear}.bar.hot i{background:#e11d48}.bar.hot{animation:pulse .6s infinite}.bar span{position:absolute;right:8px;top:-1px;font-size:11px;font-weight:700}
.tm{display:flex;justify-content:space-between;padding:7px 10px;border-radius:10px;border-left:6px solid var(--cl);margin:5px 0;background:var(--bg)}.tm.me{outline:2px solid var(--ac)}.tm.lead{animation:glow 1s infinite alternate}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-bottom:1px solid var(--bd)}.row.on{background:var(--bg)}.lg div{font-size:13px;padding:2px 0;animation:slide .4s}
.stamp{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:64px;font-weight:900;color:#fff;background:#000a;animation:stamp .5s}.stamp small{font-size:20px;color:#fff}.stamp.unsold{color:#fca5a5}
.cf b{position:absolute;top:-20px;left:calc(var(--x) * 1%);width:8px;height:13px;background:var(--cc);animation:fall 2.4s ease-in var(--d) forwards}
.rb{height:22px;border-radius:8px;background:var(--cl);animation:grow 1.4s ease-out;transform-origin:left}.trophy{font-size:80px;animation:pop 1s}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.team-card{padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);cursor:pointer;text-align:center;font-weight:700;transition:all .2s}
.team-card.sel{border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
@keyframes pulse{50%{transform:scale(1.03)}}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.2)}}@keyframes slide{from{transform:translateX(-24px);opacity:0}}
@keyframes glow{to{box-shadow:0 0 14px var(--cl)}}@keyframes stamp{from{transform:scale(3);opacity:0}}@keyframes fall{to{transform:translateY(520px) rotate(720deg)}}@keyframes grow{from{transform:scaleX(0)}}
</style>

.ha{position:absolute;right:12px;top:6px;width:168px;height:182px;z-index:2;pointer-events:none}.ha-svg{width:100%;height:100%;overflow:visible}

.ha .aL{transform-box:view-box;transform-origin:62px 134px}.ha .aR{transform-box:view-box;transform-origin:138px 134px}.ha .hd{transform-box:view-box;transform-origin:100px 110px}.ha .bdy{transform-box:view-box;transform-origin:100px 214px}

.ha[data-m=idle] .m-i,.ha[data-m=bid] .m-b,.ha[data-m=war] .m-w,.ha[data-m=once] .m-o,.ha[data-m=sold] .m-s,.ha[data-m=unsold] .m-u{display:inline}

.ha[data-m=war] .aL{animation:hxl .28s infinite alternate}.ha[data-m=war] .aR{animation:hxr .28s infinite alternate}.ha[data-m=war] .hd{animation:hxs .14s infinite alternate}
.ha[data-m=once] .aL{animation:hxc 3.2s ease-in forwards}.ha[data-m=sold] .aR{animation:hxm .3s 4 alternate}.ha[data-m=sold] .ha-svg{animation:hxj .5s infinite}.ha[data-m=sold] .bm{display:inline;animation:hxp .4s infinite alternate}
.ha[data-m=unsold] .aL{transform:rotate(57deg)}.ha[data-m=unsold] .aR{transform:rotate(-40deg)}.ha[data-m=unsold] .bdy{transform:translateY(5px)}

.gl{position:absolute;font-size:30px;top:10px}.rg-f.c .gl{right:-14px}.rg-f.p .gl{left:-14px;transform:scaleX(-1)}
.rg-b{display:none;position:absolute;top:6px;max-width:58%;background:#fff;color:#17130a;font:700 12px/1.3 system-ui;padding:5px 9px;border-radius:10px;z-index:3}.rg-b.on{display:block;animation:hpop .3s}#rb-c{left:6px}#rb-p.r{right:6px;left:auto}

.rg[data-s=idle] .fh{animation:hbob .8s infinite alternate}.rg[data-s=talk][data-w=c] .rg-f.c,.rg[data-s=talk][data-w=p] .rg-f.p,.rg[data-s=bell] .rg-f{animation:hbob .3s infinite alternate}
.rg[data-s=fight] .rg-f.c{animation:rgc .28s infinite alternate}.rg[data-s=fight] .rg-f.p{animation:rgp .28s infinite alternate}
@keyframes rgc{to{transform:translateX(44px) rotate(10deg)}}@keyframes rgp{to{transform:translateX(-44px) rotate(-10deg)}}
.rg[data-s=ko][data-k=c] .rg-f.c{transform:rotate(-80deg) translateY(26px)}.rg[data-s=ko][data-k=p] .rg-f.p{transform:rotate(80deg) translateY(26px)}

@keyframes hxb{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes hxt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@keyframes hxh{40%{transform:translateY(-16px)}}
@keyframes hxw{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}@keyframes hxl{from{transform:rotate(30deg)}to{transform:rotate(110deg)}}@keyframes hxr{from{transform:rotate(-20deg)}to{transform:rotate(-100deg)}}
@keyframes hxs{from{transform:translateX(-3px) rotate(-3deg)}to{transform:translateX(3px) rotate(3deg)}}@keyframes hxc{from{transform:rotate(0)}to{transform:rotate(146deg)}}
@keyframes hxm{from{transform:rotate(-35deg)}to{transform:rotate(30deg)}}@keyframes hxj{50%{transform:translateY(-14px)}}@keyframes hxp{from{transform:scale(.6);opacity:.4}to{transform:scale(1.3);opacity:1}}
@keyframes hshake{0%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}@keyframes hbang{0%{transform:rotate(0)}30%{transform:rotate(-70deg)}55%{transform:rotate(8deg) scale(1.3)}100%{transform:rotate(0)}}
@keyframes hraise{from{transform:translateX(-50%) translateY(16px)}to{transform:translateX(-50%) translateY(-6px)}}@keyframes hbob{to{transform:translateY(-6px)}}@keyframes hpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}}
.rg-f svg{width:100%;height:auto;display:block;overflow:visible}.rg-f.c{width:84px}.rg-f.p{width:128px}
.rg-f .ee{display:none}.rg-f[data-e=n] .e-n,.rg-f[data-e=a] .e-a,.rg-f[data-e=h] .e-h,.rg-f[data-e=k] .e-k{display:inline}
.rg[data-s=idle] .rg-f svg{animation:hbob .8s infinite alternate}.rg[data-s=idle] .rg-f.p svg{animation-duration:1.1s}

<!-- ===== EXTRA ANIMATIONS ADD-ON (auctioneer + Chinnodu + Peddodu) ===== -->
<style>
/* ---- shared ---- */
.ha .ey circle{transform-box:fill-box;transform-origin:center}
.ha .x-pop{position:absolute;left:34px;top:112px;font-size:28px;display:none}
.rg-f.c .fa{transform-origin:0% 50%}.rg-f.p .fa{transform-origin:100% 50%}
.x-cloud{position:absolute;left:50%;bottom:26px;font-size:72px;display:none;z-index:2;transform:translateX(-50%)}
.x-em{position:fixed;z-index:95;pointer-events:none;opacity:0;animation:xfloat 2.2s ease-out forwards}
@keyframes xfloat{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-170px) scale(1.2);opacity:0}}

/* ---- auctioneer solo acts (mouths) ---- */
body[data-act] .ha[data-m] .mo{display:none}
body[data-act=dance] .ha[data-m] .m-b,body[data-act=hop] .ha[data-m] .m-b,body[data-act=flex] .ha[data-m] .m-b,body[data-act=pushpa] .ha[data-m] .m-b,
body[data-act=finger] .ha[data-m] .m-o,body[data-act=wink] .ha[data-m] .m-o,
body[data-act=spin] .ha[data-m] .m-w,body[data-act=tongue] .ha[data-m] .m-w,body[data-act=faint] .ha[data-m] .m-u{display:inline}
/* ---- auctioneer solo acts (motion) ---- */
body[data-act=dance] .ha[data-m] .ha-svg{animation:xdance .45s infinite alternate}
body[data-act=dance] .ha[data-m] .aL{animation:hxl .3s infinite alternate}
body[data-act=dance] .ha[data-m] .aR{animation:hxr .3s infinite alternate}
body[data-act=dance] .ha[data-m] .hd{animation:hxt .45s infinite alternate}
body[data-act=hop] .ha[data-m] .ha-svg{animation:xhop .5s infinite}
body[data-act=hop] .ha[data-m] .aL{animation:hxl .2s infinite alternate}
body[data-act=hop] .ha[data-m] .aR{animation:hxr .2s infinite alternate}
body[data-act=finger] .ha[data-m] .aL{animation:hxc 2.6s ease-in forwards}
body[data-act=finger] .ha[data-m] .fg{animation:hxw .25s infinite alternate}
body[data-act=finger] .ha[data-m] .hd{animation:hxt .8s infinite alternate}
body[data-act=spin] .ha[data-m] .hd{animation:xspin 1s 2}
body[data-act=spin] .ha[data-m] .prop{animation-duration:.08s}
body[data-act=tongue] .ha[data-m] .hd{animation:hxs .12s infinite alternate}
body[data-act=tongue] .ha .ey circle:nth-child(3){transform:translateX(7px)}
body[data-act=tongue] .ha .ey circle:nth-child(4){transform:translateX(-7px)}
body[data-act=wink] .ha .ey circle:nth-child(2),body[data-act=wink] .ha .ey circle:nth-child(4){transform:scaleY(.12)}
body[data-act=wink] .ha[data-m] .ha-svg{animation:xlean .8s infinite alternate}
body[data-act=flex] .ha[data-m] .ha-svg{animation:xflex .5s infinite alternate}
body[data-act=flex] .ha[data-m] .aL{animation:xhc .5s infinite alternate}
body[data-act=flex] .ha[data-m] .aR{animation:xarmr .5s infinite alternate}
body[data-act=faint] .ha[data-m] .ha-svg{animation:xfaint 3s}
body[data-act=faint] .ha[data-m] .ey{display:none}
body[data-act=faint] .ha[data-m] .hp,body[data-act=faint] .ha[data-m] .sw{display:inline}
body[data-act=pushpa] .ha[data-m] .hd{animation:xpush .7s infinite alternate}
body[data-act=pushpa] .ha[data-m] .aL{animation:xchin .7s infinite alternate}

/* ---- duo: dance together ---- */
body[data-duo=dance] .ha[data-m] .ha-svg{animation:xdance .45s infinite alternate}
body[data-duo=dance] .rg[data-s=idle] .rg-f.c svg{animation:xjig .35s infinite alternate}
body[data-duo=dance] .rg[data-s=idle] .rg-f.p svg{animation:xjig .5s infinite alternate-reverse}
body[data-duo=dance] .rg[data-s=idle] .rg-f .fa{animation:xfa .25s infinite alternate}
/* ---- duo: copycat (he moves, Chinnodu copies after .5s, Peddodu after 1s) ---- */
body[data-duo=copy] .ha[data-m] .ha-svg{animation:xcopy 4.4s}
body[data-duo=copy] .ha[data-m] .aL{animation:xcarm 4.4s}
body[data-duo=copy] .rg[data-s=idle] .rg-f.c svg{animation:xcopy 4.4s .5s}
body[data-duo=copy] .rg[data-s=idle] .rg-f.p svg{animation:xcopy 4.4s 1s}
body[data-duo=copy] .rg[data-s=idle] .rg-f.c .fa{animation:xcfa 4.4s .5s}
body[data-duo=copy] .rg[data-s=idle] .rg-f.p .fa{animation:xcfa 4.4s 1s}

const getRealisticFaceSvg = (name, role, country) => {

let S=null,MY='me',host=false,online=false,doc=null,db=null,ui=null,seen={},msg='';
let activeTeamCount = 4;
let chosenTeamIndex = 0;

const bt=i=>{const p=PL[i];return p.role=='B'||p.role=='W'?p.v:p.role=='A'?p.v*.85:p.v*.35},bl=i=>{const p=PL[i];return p.role=='L'?p.v:p.role=='A'?p.v*.8:p.v*.2};
const nb=c=>c.by<0?PL[c.p].b:+(c.bid+(c.bid<2?.1:c.bid<5?.2:.25)).toFixed(2);
const can=(t,p,a)=>t.sq.length<22&&t.pu-a>=(21-t.sq.length)*.2-1e-9&&(!PL[p].os||osn(t)<8);
const log=s=>{S.lg.push(s);S.lg=S.lg.slice(-9)},tags=p=>[...p.t].map(k=>`<span class="chip tg">${TG[k]}</span>`).join('');

const mk=(teamCount)=>{
  const selectedPool = ALL_TEAMS.slice(0, teamCount);
  return {
    ph:'lobby',code:'',i:-1,c:null,lg:[],res:null,ord:[],
    t:selectedPool.map((x, idx)=>({
      n:x[0], col:x[1], uid:null, nm:'', ai:idx !== chosenTeamIndex, pu:100, sq:[], pr:.8+Math.random()*.45, xi:null
    }))
  };
};

function aiVal(t,i){const p=PL[i];if(t.sq.length>=22||(p.os&&osn(t)>=8))return 0;let v=.0105*(p.v-58)**2*t.pr;const k=r=>t.sq.filter(j=>PL[j].role==r).length;
 if(p.role=='W')v*=k('W')==0?1.3:k('W')>=2?.4:.8;if('LA'.includes(p.role)&&k('L')+k('A')<9)v*=1.2;if(t.sq.length>=16)v*=.6;if(p.os&&osn(t)>=6)v*=.6;return Math.max(Math.min(v,t.pu*.35),p.b*.9)}

function auto(t){const sq=[...t.sq].sort((a,b)=>PL[b].v-PL[a].v);let x=[],os=0;const add=i=>{if(x.length<11&&!x.includes(i)&&(!PL[i].os||os<4)){x.push(i);PL[i].os&&os++}};
 const w=sq.find(i=>PL[i].role=='W');if(w!=null)add(w);sq.filter(i=>'LA'.includes(PL[i].role)).slice(0,5).forEach(add);sq.forEach(add);sq.forEach(i=>{if(x.length<11&&!x.includes(i))x.push(i)});
 const k=i=>bt(i)+(PL[i].t.includes('o')?6:0);x.sort((a,b)=>k(b)-k(a));const g={p:[],m:[],d:[]},bw={};
 x.filter(i=>bl(i)>=58).sort((a,b)=>bl(b)-bl(a)).slice(0,7).forEach(i=>{const t=PL[i].t,pr=[t.includes('p')&&'p',t.includes('d')&&'d','m','p','d'].filter(Boolean),q=pr.find(q=>g[q].length<(q=='m'?3:2))||'m';g[q].push(i);bw[i]=q});
 const s=[...x].sort((a,b)=>PL[b].v-PL[a].v);return{o:x,c:s[0],vc:s[1],bw}}

function ev(x){const o=x.o,sg=(a,b,g)=>{const s=o.slice(a,b);return s.reduce((n,i)=>n+bt(i)*(PL[i].t.includes(g)?1.06:1),0)/s.length};
 const gp=(k,g)=>{const s=o.filter(i=>x.bw[i]==k);return[s.length?s.reduce((n,i)=>n+bl(i)*(PL[i].t.includes(g)?1.08:1),0)/s.length:35,s.length]};
 const top=sg(0,3,'o'),mid=sg(3,6,'m'),low=sg(6,11,'f'),[pp,a]=gp('p','p'),[md,b]=gp('m','s'),[dt,d]=gp('d','d'),n=a+b+d;
 const bat=.4*top+.35*mid+.25*low,bowl=.3*pp+.4*md+.3*dt-Math.max(0,5-n)*6-[a,b,d].filter(z=>z<2).length*4;
 let tot=(bat+bowl)/2;if(!o.some(i=>PL[i].role=='W'))tot-=5;tot+=2*PL[x.c].v/100+PL[x.vc].v/100;return{top,mid,low,pp,md,dt,bat,bowl,tot}}

function startAuc(){S.ord=PL.map(p=>p.i).sort((a,b)=>PL[b].v+Math.random()*14-PL[a].v-Math.random()*14);S.ph='auc';S.i=-1;next()}
function next(){S.i++;if(S.i>=S.ord.length||S.t.every(t=>t.sq.length>=22))return endAuc();const n=Date.now();S.c={p:S.ord[S.i],bid:0,by:-1,st:'bid',end:n+15000,last:n,n:0,bd:[]};log('Now on the block: '+PL[S.c.p].n)}
function endAuc(){const free=PL.filter(p=>!S.t.some(t=>t.sq.includes(p.i))).sort((a,b)=>(a.os-b.os)||b.v-a.v);S.t.forEach(t=>{while(t.sq.length<11&&free.length)t.sq.push(free.shift().i);if(t.ai)t.xi=auto(t)});S.ph='xi';log('Auction complete!');chk()}
function bid(id,q){const c=S.c;if(S.ph!='auc'||c.st!='bid'||c.by===id)return;const t=S.t[id],a=nb(c);if(!can(t,c.p,a))return;const n=Date.now();c.bid=a;c.by=id;c.last=n;c.end=Math.max(c.end,n+9000);c.n++;c.bd.includes(id)||c.bd.push(id);log(`${t.n} bid ${m(a)}`);q||sync()}
function chk(){if(S.t.every(t=>t.ai||t.xi||!t.uid))fin();else sync()}
function fin(){S.t.forEach(t=>{if(!t.xi)t.xi=auto(t)});S.res=S.t.map((t,i)=>{const e=ev(t.xi);return{i,e,tot:e.tot+(Math.random()-.5)*6}}).sort((a,b)=>b.tot-a.tot);S.ph='res';sync()}

function tick(){if(!host||!S||S.ph!='auc')return;const c=S.c,n=Date.now();
 if(c.st=='bid'){if(n>=c.end){if(c.by>=0){const t=S.t[c.by];t.pu=+(t.pu-c.bid).toFixed(2);t.sq.push(c.p);c.st='sold';log(`SOLD! ${PL[c.p].n} to ${t.n} for ${m(c.bid)}`)}else{c.st='unsold';log(PL[c.p].n+' goes unsold')}c.end=n+3800;return sync()}
  if(n-c.last>2300)for(const k of S.t.map((_,idx)=>idx).sort(()=>Math.random()-.5)){const t=S.t[k],a=nb(c);if(t.ai&&c.by!==k&&a<=aiVal(t,c.p)&&can(t,c.p,a)&&Math.random()<.2){bid(k);break}}}
 else if(n>=c.end){next();sync()}}

async function sync(){render();if(online&&host&&doc)try{await doc.update({j:JSON.stringify(S)})}catch(e){}}
function hostSnap(d){if(!d||!S)return;for(const k in d)if(k[0]=='a'&&k[1]=='_'){let a;try{a=JSON.parse(d[k])}catch(e){continue}if(seen[k]===a.k)continue;seen[k]=a.k;const u=k.slice(2),ti=S.t.findIndex(t=>t.uid===u);
 if(a.type=='join'&&S.ph=='lobby'&&ti<0){const f=S.t.find(t=>t.ai);if(f){f.ai=false;f.uid=u;f.nm=a.nm;sync()}}else if(a.type=='bid'&&ti>=0)bid(ti);else if(a.type=='xi'&&ti>=0&&S.ph=='xi'){S.t[ti].xi=a.x;chk()}}}

const A={
 setTeamsCount(v){activeTeamCount=+v;render();},

const ringEl=()=>document.querySelector('#h-ring .rg');
const rgIdle=()=>{const r=ringEl();return !!r&&r.dataset.s=='idle'&&r.isConnected};
let cur='',endT=0,tok=0,nxt=Date.now()+6000,curLine='';
function burst(list,n,sel){const el=document.querySelector(sel);if(!el)return;const r=el.getBoundingClientRect();
 for(let i=0;i<n;i++){const e=document.createElement('span');e.className='x-em';e.textContent=f(list);
  e.style.left=(r.left+Math.random()*r.width)+'px';e.style.top=(r.top+r.height*.4)+'px';e.style.fontSize=(22+Math.random()*20)+'px';
  e.style.animationDelay=(i*.09)+'s';e.style.setProperty('--dx',(Math.random()*90-45)+'px');B.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function setHa(t){curLine=t;const b=document.querySelector('.ha-b');if(b)b.textContent='[Bala Subbarao]: '+t}
function say(w,t){
 if(w=='a')return setHa(t);
 const c=document.getElementById('rb-c'),p=document.getElementById('rb-p');if(!c||!p||!rgIdle())return;
 c.className='rg-b'+(w=='c'?' on':'');p.className='rg-b r'+(w=='p'?' on':'');
 (w=='c'?c:p).textContent=(w=='c'?'Chinnodu: ':'Peddodu: ')+t}
function face(w,e){const x=document.querySelector('#h-ring .rg-f.'+w);if(x&&rgIdle())x.dataset.e=e}
function fx(t){const x=document.getElementById('rg-fx');if(x&&rgIdle())x.textContent=t}
function stop(){
 tok++;cur='';curLine='';delete B.dataset.act;delete B.dataset.duo;nxt=Date.now()+7000+Math.random()*6000;
 if(rgIdle()){face('c','n');face('p','n');fx('');const c=document.getElementById('rb-c'),p=document.getElementById('rb-p');if(c)c.className='rg-b';if(p)p.className='rg-b r'}}
function start(){
 const id=++tok;
 if(rgIdle()&&Math.random()<.55){
  const k=f(Object.keys(DUO)),D=DUO[k];cur=k;endT=Date.now()+D.d;B.dataset.duo=k;
  if(D.act)B.dataset.act=D.act;else delete B.dataset.act;
  D.s.forEach(([w,t,ms])=>setTimeout(()=>{if(tok==id)say(w,t)},ms));
  D.fx.forEach(([ms,l,n,sel])=>setTimeout(()=>{if(tok==id)burst(l,n,sel)},ms));
  fx(D.rg);
  if(k=='bonk'){setTimeout(()=>{if(tok==id)face('p','k')},1650);setTimeout(()=>{if(tok==id)face('p','n')},3100)}
 }else{
  const k=f(Object.keys(ACT)),A=ACT[k];cur=k;endT=Date.now()+A.d;B.dataset.act=k;delete B.dataset.duo;
  setHa(f(A.l));burst(A.e,6,'.ha')}}

setInterval(()=>{try{
 const S=G();
 if(!S||S.ph!='auc'||!S.c){if(cur)stop();delete B.dataset.m;return}
 const c=S.c,now=Date.now(),l=c.end-now,
  mo=c.st=='sold'?'sold':c.st=='unsold'?'unsold':c.by<0?'idle':l<4000?'once':c.n>=5?'war':'bid';
 B.dataset.m=mo;
 const ok=(mo=='idle'||mo=='bid')&&l>5000;
 if(cur&&(now>endT||!ok))stop();
 else if(!cur&&ok&&now>nxt)start()}catch(e){}},300);

function inject(){
 const rg=ringEl();if(rg&&!rg.querySelector('.x-cloud'))rg.insertAdjacentHTML('beforeend','<div class="x-cloud">💨</div>');
 const ha=document.querySelector('.ha');if(ha&&!ha.querySelector('.x-pop')){const p=document.createElement('div');p.className='x-pop';p.textContent='🍿';ha.insertBefore(p,ha.lastChild)}}
if(typeof render==='function'){const _r=render;render=function(){_r();try{inject();if(cur&&curLine)setHa(curLine)}catch(e){}}}
inject();
}catch(e){console.warn('animations add-on skipped:',e)}
})();
</script>

<script>
(function(){
try{
const gS=()=>typeof S!=='undefined'?S:null,gOn=()=>typeof online!=='undefined'&&!!online,
 gMY=()=>typeof MY!=='undefined'?MY:'me',gDb=()=>typeof db!=='undefined'?db:null;

const tk=document.getElementById('h-ticker');
if(tk){
 tk.classList.add('xlive');const hd=document.querySelector('header');if(hd)hd.after(tk);
 let busy=0;
 const fmt=()=>{
  if(busy)return;busy=1;
  const raw=tk.textContent.replace(/^[^A-Za-z]*Live Commentary:\s*/i,'').trim(),m=raw.match(/^(\S+)\s+([^:]{3,40}):\s*([\s\S]+)$/);
  tk.textContent='';
  if(m){const sp=document.createElement('span');sp.className='xsp'+(m[1]=='🧆'?' s1':'');sp.textContent=m[1]+' '+m[2];tk.appendChild(sp);tk.appendChild(document.createTextNode(m[3]))}
  else tk.appendChild(document.createTextNode('🎙️ '+raw));
  tk.classList.remove('xflash');void tk.offsetWidth;tk.classList.add('xflash');
  obs.takeRecords();busy=0};
 const obs=new MutationObserver(fmt);obs.observe(tk,{childList:true,characterData:true,subtree:true});fmt();
}

document.addEventListener('click',e=>{const h=e.target.closest('#h-ring .rg-h');if(h)document.getElementById('h-ring').classList.toggle('xmin')});
setInterval(()=>{const r=document.getElementById('h-ring');if(r&&!r._x){r._x=1;if(innerWidth<800)r.classList.add('xmin')}},500);

document.body.insertAdjacentHTML('beforeend',
 '<button id="xc-btn" title="Room chat">💬<i id="xc-bd"></i></button>'+
 '<div id="xc-box"><div class="xc-h"><b>💬 Room chat</b><span id="xc-who"></span><button id="xc-x">✕</button></div><div id="xc-msgs"></div>'+
 '<div class="xc-q"><button data-r="👏">👏</button><button data-r="🔥">🔥</button><button data-r="😂">😂</button><button data-r="😮">😮</button><button data-r="💰">💰</button>'+
 '<button data-t="Bid cheyyandi! 🔨">Bid cheyyandi! 🔨</button><button data-t="Wallet ready ra 💰">Wallet ready ra 💰</button><button data-t="Nuvvu odipothav 😜">Nuvvu odipothav 😜</button></div>'+
 '<div class="xc-in"><input id="xc-i" maxlength="120" placeholder="Type a message…" autocomplete="off"><button id="xc-s">Send</button></div></div>');
const btn=document.getElementById('xc-btn'),box=document.getElementById('xc-box'),msgs=document.getElementById('xc-msgs'),bd=document.getElementById('xc-bd'),inp=document.getElementById('xc-i');
let ref=null,code='',path='',fb=0,unread=0,last=0;
const me=()=>{const s=gS(),t=s&&s.t.find(x=>x.uid===gMY());return t?{n:(t.nm||t.n.split(' ')[0]),c:t.col}:{n:'Guest',c:'#aaa'}};
function sys(t){const d=document.createElement('div');d.className='xc-m sys';d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function fly(e){const x=document.createElement('span');x.className='xc-em';x.textContent=e;x.style.left=(10+Math.random()*80)+'vw';x.style.bottom='80px';document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function show(m){
 if(!m)return;const mine=m.u===gMY();
 if(m.e){if(Date.now()-(m.ts||0)<5000)fly(m.e)}
 const d=document.createElement('div');d.className='xc-m'+(mine?' me':'');
 const b=document.createElement('b');b.style.color=m.c||'#e6b24a';b.textContent=m.n||'Player';d.appendChild(b);
 d.appendChild(document.createTextNode(m.e||String(m.t||'').slice(0,120)));
 msgs.appendChild(d);while(msgs.children.length>80)msgs.firstChild.remove();msgs.scrollTop=msgs.scrollHeight;
 if(!box.classList.contains('on')&&!mine){unread++;bd.textContent=unread;bd.style.display='block'}}
function sub(){ref=gDb().ref(path).limitToLast(50);ref.on('child_added',s=>show(s.val()),()=>{if(!fb){fb=1;path='rooms/'+code+'/chat';sub()}})}
function detach(){if(ref){try{ref.off()}catch(e){}}ref=null;code='';fb=0;msgs.textContent='';unread=0;bd.style.display='none'}
function attach(c){detach();if(!gDb())return;code=c;path='chats/'+c;sub();sys('Chat connected · room '+c)}
function send(o){
 const d=gDb();if(!d||!code||Date.now()-last<900)return;last=Date.now();
 const u=me(),m=Object.assign({u:gMY(),n:u.n,c:u.c,ts:Date.now()},o);
 const p=d.ref(path).push(m);
 if(p&&p.catch)p.catch(()=>{if(!fb){fb=1;try{ref.off()}catch(e){}path='rooms/'+code+'/chat';sub();last=0;send(o)}})}
const say=()=>{const t=inp.value.trim();if(t){send({t:t.slice(0,120)});inp.value=''}};
btn.onclick=()=>{box.classList.toggle('on');if(box.classList.contains('on')){unread=0;bd.style.display='none';msgs.scrollTop=msgs.scrollHeight;inp.focus()}};
document.getElementById('xc-x').onclick=()=>box.classList.remove('on');
document.getElementById('xc-s').onclick=say;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')say()});
box.addEventListener('click',e=>{const q=e.target.closest('[data-r],[data-t]');if(!q)return;q.dataset.r?send({e:q.dataset.r}):send({t:q.dataset.t})});
setInterval(()=>{
 const s=gS(),c=gOn()&&s&&s.code?s.code:'';
 if(c!==code){c?attach(c):detach()}
 btn.style.display=c?'block':'none';if(!c)box.classList.remove('on');
 if(s){const n=s.t.filter(t=>!t.ai&&t.uid).length;document.getElementById('xc-who').textContent=n+' player'+(n==1?'':'s')+' online'}},700);
}catch(e){console.warn('commentary/chat add-on skipped:',e)}
})();
</script>
