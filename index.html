 "Balayya style: gavel tho train aapestha! 🚂😂","Butta Bomma laaga muddhu ga bid cheyyandi 😍","RRR laaga fire + water: wallet + bid! 🔥💧",
 "Naatu Naatu step veyyala? Bid pettaru anandi! 🕺","Jathi Ratnalu laaga comedy ga bid cheyyandi, serious ga kaadu! 🤣",
 "Yamadonga laaga Yamudu kuda ee auction lo bid pettali! 😈","Hero ki entry BGM undali, naa entry ki gavel sound! 🔨",
 "Interval bang! Bidding lo twist! 🎬","Climax fight laaga last 5 seconds lo bid pettandi! 🥊","Telugu hero 10 mandi ni kodtadu, meeru 10 bids tho kottandi! 👊",
 "Pokiri laaga commit ayithe venakki tippakandi! 😎","Mahishmati rates ivi — raja lu ye bid cheyyali! 👑","Arjun Reddy attitude tho bid pettaku, dabbulu poguduthayi! 😅"];
const ACTS={

 tongue:{d:2600,l:["Brahmi expression: 'Ayyo… ee rate aa?' 🤪","Cross-eyed ayipoya rates chusi! 😵‍💫","Bleh! Bid pettakapothe ila untanu! 😝"],e:['😝','🤪','😂']},
 wink:{d:2400,l:["Ey! Wink wink… bid pettandi! 😉","Ee wink ki oka bid free! 😘","Naa wink mee wallet ki ✔ ante! 😉"],e:['😉','😘','💋']},
 hat:{d:2600,l:["Hat toss! 🎩 Magic chusara?","Mass hat spin ra! 🌀","Hat ekkadiki poindi? Bid ki poindi! 😂"],e:['🎩','✨','🌀']},
 flex:{d:3000,l:["Baahubali laaga gavel lift! 💪","Gym lo vunnaa ra, bid ki ready! 💪","Muscle chusi bid pettandi! 🏋️"],e:['💪','🔥','😤']},
 faint:{d:3000,l:["Rates chusi faint ayyanu... 😵","Thud! Wallet kuda faint ayindi! 💀","Doctor! Bid cheyyandi, lekapothe nenu levanu! 🚑"],e:['😵','💫','🚑']},
 hero:{d:3200,l:["Hero entry! Slow-mo, BGM, mass! 🎬😎","Mass entry ra! Gaali, dhool, gavel! 🌪️","Interval bang! Ippudu bidding ki mass! 🔥"],e:['😎','🔥','🎬','⭐']},
 pushpa:{d:2800,l:["Pushpa… thaggedhe le! (chin sweep) 🔥","Bid thaggedhe le! Shoulder shrug ra! 😎","Fire kaadu… wildfire! 🔥 (beard flick)"],e:['🔥','😎','🌟']},
 cry:{d:2800,l:["Bid ledu ani edustunna! 😭","Waaaa! Wallets close chesaru! 😭","Naa gavel ki kanneellu vachayi! 💧"],e:['😭','💧','🥺']}};
const ACTN=Object.keys(ACTS);
const DUOS={
 duodance:{duo:1,au:'dance',d:3800,l:["Mugguru kalisi Naatu step! Mass! 🎶","👦 Chinnodu: Anna, naa step chudu! 🕺","😤 Pedda Babu: Naa step bigger ra! 💃","Triple dance masala! 🎉"],e:['🎵','🎶','🕺','💃','🎉']},
 mimic:{duo:1,au:'',d:4200,l:["👦 Chinnodu copy kodthunnadu! 🐒","Auctioneer cheppina step, mugguru copy cheyyandi! 🪞","😤 Pedda Babu: Nenu copy kaadu… original! 😂 (copy chesthunnadu)","Monkey see, monkey do — Telugu edition! 🐵"],e:['🐒','🪞','😂','🤣']},
 fight:{duo:1,au:'',d:3600,l:["😤 Pedda Babu ki gavel bonk! 🔨😵","👦 Chinnodu: Anna super hit! 👏","Auction lo fight kaadu, bid cheyyandi! 🥊😂","Bonk! Dizzy ayipoyaadu 😵‍💫"],e:['👊','🔨','😂'],t:[[1500,['💥','😵','⭐','🌟'],8]]},
 brawl:{duo:1,au:'wink',d:3800,l:["Mugguru dhool lo fight! Nenu popcorn tho enjoy! 🍿😂","👦 vs 😤 — cartoon fight time! 💨👊","Fight chudandi, bid marchipokandi! 🍿","Dhoom dhaam fight! 💥 Bid cheyyandi ra! 🔨"],e:['🍿','😂','👊'],t:[[900,['💥','👊','😵','⭐'],7],[2200,['💥','🤕','⭐','👊'],7]]}};
const DUON=Object.keys(DUOS);Object.assign(ACTS,DUOS);
const CQ=["👦 Chinnodu: Anna, nenu kuda bid pettala? Pocket money tho! 😂","👦 Chinnodu: Anna, biryani ekkada? 🍗","👦 Chinnodu: Auctioneer anna, hat naaku ivvava? 🎩","👦 Chinnodu: 'Thaggedhe le' ante ee gavel naadhe! 🔨","😤 Pedda Babu: Ee auction naadhi ra, nuvvu aagu! 😤","😤 Pedda Babu: Naa gavel bigger! 🔨","😤 Pedda Babu: Mass entry naaku kavali! 😎","😤 Pedda Babu: Naa bid ki velu ledu ra! 💰"];
HYPE.push("Mass ra! 💥","Blockbuster bid! 🎬");
WARL.push("RRR laaga fire + water — bidding war! 🔥💧","Climax fight laaga bidding! 🥊");
SOLDL.push(()=>"SOLD! Shubham card padindi — villain ki 'The End'! 🎬",()=>"Climax lo hero gelicharu: "+S.t[S.c.by].n+"! 🏆");
UNL.push("Flop movie laaga unsold ayindi! 🎞️😂","Pre-release hype ekkuva, box office zero! 😂");

let last='',line='',lot=-1,pn=0,pb=0,wowT=0,act='',actEnd=0,nextAct=Date.now()+5000;
function upd(){
 if(!S||S.ph!='auc'||!S.c)return;
 const hc=document.querySelector('.card.lg');if(!hc)return;
 let w=hc.querySelector('.au-wrap'),fresh=0;
 if(!w){const d=document.createElement('div');d.className='au-wrap';d.innerHTML=SVG;hc.appendChild(d);w=d;fresh=1}
 const c=S.c,now=Date.now(),l=c.end-now;
 if(lot!=S.i){lot=S.i;pn=0;pb=0;wowT=0}
 if(c.n>pn){
  if((c.n==1&&(PL[c.p].v>=85||Math.random()<.4))||Math.floor(c.bid/5)>Math.floor(pb/5)){wowT=now+1700;burst(['😘','😍','🤩','💋','😂','🥰','😲'],9)}
  pn=c.n;pb=c.bid}
 let mo,ix=0;
 if(c.st=='sold')mo='sold';else if(c.st=='unsold')mo='unsold';
 else if(now<wowT)mo='wow';
 else if(c.by<0){mo='idle';ix=Math.max(0,Math.floor((now-(c.end-15000))/4500))}
 else if(l<4000){mo='once';ix=l>2700?0:l>1300?1:2}
 else if(c.n>=4)mo='war';else mo='bid';
 const key=mo+'|'+S.i+'|'+c.n+'|'+ix,changed=key!==last;let pop=0;
 if(act&&(mo=='sold'||mo=='unsold'||mo=='wow'||now>actEnd))act='';
 if(!act&&now>nextAct&&(mo=='idle'||mo=='bid')){
  act=Math.random()<.45?f(DUON):f(ACTN);const A0=ACTS[act];actEnd=now+A0.d;nextAct=actEnd+6000+Math.random()*5000;line=f(A0.l);burst(A0.e,6);if(A0.t)A0.t.forEach(x=>setTimeout(()=>burst(x[1],x[2]),x[0]));pop=1}
 else if(changed&&!act){
  const P=pj(PL[c.p]),J=P.concat(G,MV);pop=1;
  if(mo=='idle')line=ix==0&&P.length?f(P):Math.random()<.2?f(CQ):f(J);
  else if(mo=='bid')line=Math.random()<.16?f(CQ):Math.random()<.5?f(J):run(f(HYPE));
  else if(mo=='war')line=Math.random()<.5?f(J):run(f(WARL));
  else if(mo=='once')line=ONCE[ix];
  else if(mo=='wow')line=f(WOW);
  else if(mo=='sold'){line=run(f(SOLDL));burst(['🥳','😘','💰','🎉','😍','🤑'],11)}
  else{line=f(UNL);burst(['😂','🤣','😭'],6)}
 }
 last=key;
 const au=w.querySelector('.au'),b=w.querySelector('.au-b');
 au.dataset.mood=mo;const AC=act&&ACTS[act];
 if(AC&&AC.duo){au.dataset.duo=act;if(AC.au)au.dataset.act=AC.au;else delete au.dataset.act}
 else{delete au.dataset.duo;if(act)au.dataset.act=act;else delete au.dataset.act}
 if(pop||fresh){b.textContent=line;if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}
}
const _r=render;render=function(){_r();upd();drawOpt();if(S&&S.ph=='lobby')lobbyBtns()};
setInterval(upd,200);

/* ---------- more teams + pick your team ---------- */
const EXTRA=[['Hyderabad Sparks','#ff8a00'],['Vizag Vikings','#00c2a8'],['Delhi Dazzlers','#ff4fa3'],['Rajasthan Rockets','#7ad03a']];
const ALL=[...TN,...EXTRA];let NT=4,MYT=0,pseen={};
const applyTeams=()=>{TN.length=4;if(NT>4)TN.push(...EXTRA.slice(0,NT-4))};
function swap(a,b){const x=S.t[a],y=S.t[b];y.ai=false;y.uid=x.uid;y.nm=x.nm;x.ai=true;x.uid=null;x.nm=''}
const _so=A.solo;A.solo=function(){applyTeams();_so();if(S&&MYT>0&&MYT<S.t.length){swap(0,MYT);render()}};
const _ho=A.host;A.host=async function(){applyTeams();await _ho();if(S&&MYT>0&&MYT<S.t.length){swap(0,MYT);sync()}};
const _sk=A.skip;A.skip=function(){
 if(!S||S.t.length<=4)return _sk();
 const c=S.c;if(online||c.st!='bid'||c.by===S.t.findIndex(t=>t.uid===MY))return;
 for(let n=0;n<300;n++){let hit=0;for(const k of S.t.map((_,i)=>i).sort(()=>Math.random()-.5)){const t=S.t[k],a=nb(c);if(t.ai&&c.by!==k&&a<=aiVal(t,c.p)&&can(t,c.p,a)){bid(k,1);hit=1;break}}if(!hit)break}
 log('You skipped '+PL[c.p].n);c.end=Date.now();tick()};
const _tk=tick;tick=function(){_tk();try{extraAI()}catch(e){}};
function extraAI(){
 if(!host||!S||S.ph!='auc'||S.t.length<=4)return;const c=S.c,n=Date.now();
 if(c.st!='bid'||n-c.last<=2300)return;
 for(const k of S.t.map((_,i)=>i).filter(i=>i>=4).sort(()=>Math.random()-.5)){const t=S.t[k],a=nb(c);
  if(t.ai&&c.by!==k&&a<=aiVal(t,c.p)&&can(t,c.p,a)&&Math.random()<.2){bid(k);break}}}
const _ea=endAuc;endAuc=function(){
 try{if(S.t.length>4)for(const t of S.t)while(t.sq.length<11){
  const d=S.t.filter(x=>x!==t&&x.sq.length>11).sort((a,b)=>b.sq.length-a.sq.length)[0];if(!d)break;
  const lo=d.sq.reduce((a,b)=>PL[b].v<PL[a].v?b:a);d.sq.splice(d.sq.indexOf(lo),1);t.sq.push(lo)}}catch(e){}
 _ea()};
function seat(uid,nmv,ti){const t=S&&S.t[ti];if(!t||S.ph!='lobby'||!t.ai)return;
 const o=S.t.find(x=>x.uid===uid);if(o){o.ai=true;o.uid=null;o.nm=''}
 t.ai=false;t.uid=uid;t.nm=nmv||'Manager';sync()}
const _hs=hostSnap;hostSnap=function(d){
 if(d&&S)for(const k in d)if(k.slice(0,2)=='a_'){let a;try{a=JSON.parse(d[k])}catch(e){continue}
  if(a.type=='pick'&&pseen[k]!==a.k){pseen[k]=a.k;seat(k.slice(2),a.nm,a.t)}}
 _hs(d)};
function lobbyBtns(){document.querySelectorAll('.card.c .tm').forEach((r,i)=>{
 if(r.querySelector('.pk'))return;const t=S.t[i];if(!t)return;
 const b=document.createElement('button');b.className='sm pk';
 if(t.uid===MY){b.textContent='✔ Your team';b.classList.add('sel')}
 else if(t.ai){b.textContent='🙋 Pick';b.dataset.pk=i}else{b.textContent='🔒';b.disabled=true}
 r.appendChild(b)})}
function drawOpt(){
 if(S)return;const c=document.querySelector('.card.c');if(!c)return;
 let o=c.querySelector('.au-opt');
 if(!o){const p=c.querySelector('p.mu');if(!p)return;p.insertAdjacentHTML('afterend','<div class="au-opt"></div>');o=c.querySelector('.au-opt')}
 o.innerHTML='<b>👥 More friends? Choose teams</b><br>'+[4,6,8].map(n=>`<button class="sm ${NT==n?'sel':''}" data-nt="${n}">${n} teams</button>`).join('')+
 '<br><b>🏏 Pick your team</b><br>'+ALL.slice(0,NT).map((t,i)=>`<button class="sm ${MYT==i?'sel':''}" data-st="${i}" style="border-left:6px solid ${t[1]}">${t[0]}</button>`).join('')+
 '<small>Extra seats are played by AI. Friends can pick their own team in the lobby.</small>'}
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nt]'),s2=e.target.closest('[data-st]'),k=e.target.closest('[data-pk]');
 if(n){NT=+n.dataset.nt;if(MYT>=NT)MYT=0;drawOpt()}
 else if(s2){MYT=+s2.dataset.st;drawOpt()}
 else if(k){const ti=+k.dataset.pk,me=S.t.find(t=>t.uid===MY),name=me?me.nm:'Manager';host?seat(MY,name,ti):send({type:'pick',t:ti,nm:name})}});

/* ---------- floating kid-friendly background ---------- */
(function(){const bg=document.createElement('div');bg.id='au-bg';
 bg.innerHTML=Array.from({length:16},(_,i)=>`<span style="left:${Math.random()*100}%;font-size:${22+Math.random()*26}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*20}s">${['🎈','⭐','🏏','🍭','🎉','🪁','🧢','🌈'][i%8]}</span>`).join('');
 document.body.prepend(bg)})();
drawOpt();
})();
