function aiVal(t,i){const p=PL[i];if(t.sq.length>=22||(p.os&&osn(t)>=8))return 0;let v=.0105*(p.v-58)**2*t.pr;const k=r=>t.sq.filter(j=>PL[j].role==r).length;
 if(p.role=='W')v*=k('W')==0?1.3:k('W')>=2?.4:.8;if('LA'.includes(p.role)&&k('L')+k('A')<9)v*=1.2;if(t.sq.length>=16)v*=.6;if(p.os&&osn(t)>=6)v*=.6;return Math.max(Math.min(v,t.pu*.35),p.b*.9)}

function auto(t){const sq=[...t.sq].sort((a,b)=>PL[b].v-PL[a].v);let x=[],os=0;const add=i=>{if(x.length<11&&!x.includes(i)&&(!PL[i].os||os<4)){x.push(i);PL[i].os&&os++}};
 const w=sq.find(i=>PL[i].role=='W');if(w!=null)add(w);sq.filter(i=>'LA'.includes(PL[i].role)).slice(0,5).forEach(add);sq.forEach(add);sq.forEach(i=>{if(x.length<11&&!x.includes(i))x.push(i)});
 const k=i=>bt(i)+(PL[i].t.includes('o')?6:0);x.sort((a,b)=>k(b)-k(a));const g={p:[],m:[],d:[]},bw={};
 x.filter(i=>bl(i)>=58).sort((a,b)=>bl(b)-bl(a)).slice(0,7).forEach(i=>{const t=PL[i].t,pr=[t.includes('p')&&'p',t.includes('d')&&'d','m','p','d'].filter(Boolean),q=pr.find(q=>g[q].length<(q=='m'?3:2))||'m';g[q].push(i);bw[i]=q});
 const s=[...x].sort((a,b)=>PL[b].v-PL[a].v);return{o:x,c:s[0],vc:s[1],bw}}

function ev(x){const o=x.o,sg=(a,b,g)=>{const s=o.slice(a,b);return s.reduce((n,i)=>n+bt(i)*(PL[i].t.includes(g)?1.06:1),0)/s.length};
 const gp=(k,g)=>{const s=o.filter(i=>x.bw[i]==k);return[s.length?s.reduce((n,i)=>n+bl(i)*(PL[i].t.includes(g)?1.08:1),0)/s.length:35,s.length]};
 const top=sg(0,3,'o'),mid=sg(3,6,'m'),low=sg(6,11,'f'),[pp,a]=gp('p','p'),[md,b]=gp('m','s'),[dt,d]=gp('d','d'),n=a+b+d;
 const bat=.4*top+.35*mid+.25*low,bowl=.3*pp+.4*md+.3*dt-Math.max(0,5-n)*6-[a,b,d].filter(z=>z<2).length*4;
 let tot=(bat+bowl)/2;if(!o.some(i=>PL[i].role=='W'))tot-=5;tot+=2*PL[x.c].v/100+PL[x.vc].v/100;return{top,mid,low,pp,md,dt,bat,bowl,tot}}

<!-- Mic toggle integration script -->
<script>
(function(){
try{
const B=document.body;
B.insertAdjacentHTML('beforeend','<button id="mic-btn" title="Toggle Voice/Mic Commentary">🎙️</button>');
const micBtn=document.getElementById('mic-btn');
let micActive=false, recognition=null;

if(('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window)){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = function(event) {
    const speechToText = event.results[event.results.length - 1][0].transcript.trim();
    if(speechToText && typeof send === 'function' && online) {
      send({t: "🎙️ [Voice]: " + speechToText});
    }
  };
  recognition.onerror = function(e){ console.warn("Mic error:", e); };
}

micBtn.onclick = function(){
  if(!recognition){
    alert("Speech recognition is not supported in this browser.");
    return;
  }
  micActive = !micActive;
  micBtn.classList.toggle('active', micActive);
  if(micActive){
    recognition.start();
    micBtn.title = "Voice/Mic Active (Click to Mute)";
  } else {
    recognition.stop();
    micBtn.title = "Toggle Voice/Mic Commentary";
  }
};

setInterval(()=>{
  const s = (typeof S!=='undefined'?S:null);
  const isOnline = (typeof online!=='undefined'&&!!online);
  micBtn.style.display = (isOnline && s && s.code) ? 'block' : 'none';
  if(!isOnline && micActive && recognition){
    micActive = false;
    micBtn.classList.remove('active');
    recognition.stop();
  }
}, 500);

}catch(e){console.warn('Mic integration skipped:', e);}
})();
</script>
