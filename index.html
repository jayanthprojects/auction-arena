const SOLD=(p,t)=>[['c',`SOLD ayyindi anna! ${t} ki ${p} dorikadu!`],['p',`Ee rate ki Hyderabad lo flat kontaaru ra!`]];
const UNS=p=>[['c',`Anna ${p} ki evaru teesukoru!`],['p',`Teesukokapothe nenu teesukuntaa… budget ledu ra!`]];
// ---- auctioneer roasts on the real players
const RB=["{n} bid pettaadu! Dabbu ekkadi nundi vachindi? Nanna pocket aa? 😂","{n} garu bid pettaru — wallet ki 'RIP' pettandi 🪦","{n}: 'Nenu ready!' Wallet: 'Nenu ready kaadu!' 😭","{n} mukham lo confidence, account lo 'balance enquiry' 😅","{n} ni chusthe KGF Rocky bhai gurthostadu — kani wallet 'Rocky' kaadu 😆"],RW=["{n} ki player dorikadu, ippudu EMI start! 💳😂","{n} champion laaga undi, wallet lo mirchi bajji migilindi! 🌶️","{n} gelichadu! Party ivvali, biryani ivvali! 🍛"],RI=["{n} sleeping aa? Bid pettandi anna! 😴","{n}, wallet ki fevicol esaaraa? Bid pettandi! 🧴","{n} 'Wait and watch' strategy tho undi 🧐 — kani auction aagadu!"];
// ---- animated auction floor replaces the boring team table
function floor(){const a=document.getElementById('app');if(!S||S.ph!='auc'||!S.c||!a.querySelector('.g'))return;const c=S.c,p=PL[c.p],me=S.t.findIndex(t=>t.uid===MY),e=document.createElement('section');e.className='card';e.id='h-floor';
 e.innerHTML=`<div class="fl-tbl ${c.st=='bid'&&c.n>=5?'hot':''}"><span class="fl-g ${c.st!='bid'?'bang':''}">🔨</span><div><b>${p.n}</b><br><small>${c.st=='sold'?'SOLD! '+m(c.bid):c.st=='unsold'?'UNSOLD':c.by<0?'Opening '+m(nb(c)):'Current '+m(c.bid)}</small></div><span class="fl-g">📒</span></div><div class="fl-seats">`+S.t.map((t,i)=>`<div class="fs ${c.by==i?'ld':''} ${c.bd.includes(i)?'in':''} ${i==me?'me':''}" style="--cl:${t.col}"><div class="pd2">${c.by==i?m(c.bid):'🪧'}</div><div class="hd">${ini(t.n)}</div><small><b>${t.n.split(' ')[0]}${t.ai?'':' 👤'}</b></small><div class="pb"><i style="width:${Math.max(0,t.pu)}%"></i></div><small>${m(t.pu)} · ${t.sq.length}/22</small></div>`).join('')+'</div>';a.insertBefore(e,a.firstChild)}
// ---- bots on/off for online rooms
let bots=true;function lobBots(){if(!S||S.ph!='lobby'||!host||!online||document.querySelector('.h-bots'))return;const b=document.querySelector('[data-a=start]');if(!b)return;const d=document.createElement('div');d.className='h-bots';d.innerHTML=`<button class="sm ${bots?'sel':''}" data-hb>🤖 Bots: ${bots?'ON':'OFF'}</button><br><small>${bots?'Empty seats are played by AI bots.':'Empty seats are removed. Needs at least 2 human players.'}</small>`;b.before(d)}
const _st=A.start;A.start=function(){if(online&&!bots){if(S.t.filter(t=>!t.ai).length<2){say('Need at least 2 human players, or turn Bots ON','⚠️ Lobby');return}S.t=S.t.filter(t=>!t.ai)}_st()};
const _tb=tick;tick=function(){try{_tb()}catch(e){}};
// ---- room chat (Firebase child "chat" under the room)
let room=null,unread=0,lt=0;const cb=mkd('h-cb','💬<i id="h-bd"></i>','button'),ch=mkd('h-chat','<div class="h-ch">💬 Room chat</div><div id="h-msgs"></div><div class="h-q">'+['😂','👏','🔥','🤡','😭','💸'].map(e=>`<button data-hr="${e}">${e}</button>`).join('')+'</div><div class="h-in"><input id="h-ci" maxlength="120" placeholder="Type a message…"><button class="btn" data-hs>Send</button></div>'),bd=document.getElementById('h-bd');cb.style.display='none';
const myName=()=>{const t=S&&S.t.find(t=>t.uid===MY);return t&&t.nm||'Guest'},put=o=>{if(Date.now()-lt<500)return;lt=Date.now();try{doc.child('chat').push(Object.assign({u:myName(),id:MY,ts:Date.now()},o))}catch(e){}};
function addMsg(v){if(!v)return;const box=document.getElementById('h-msgs'),d=document.createElement('div');if(v.r&&Date.now()-v.ts<6000)fl(v.r);d.innerHTML='<b></b> <span></span>';d.firstChild.textContent=(v.u||'?')+':';d.lastChild.textContent=v.r||v.t||'';if(v.id===MY)d.className='me';box.appendChild(d);box.scrollTop=1e9;if(!ch.classList.contains('on')&&v.id!==MY&&!v.r){unread++;bd.textContent=unread;bd.style.display='block'}}
setInterval(()=>{const ok=online&&doc&&S;cb.style.display=ok?'block':'none';if(!ok){ch.classList.remove('on');return}if(room!==doc.key){room=doc.key;document.getElementById('h-msgs').innerHTML='';doc.child('chat').limitToLast(40).on('child_added',s=>addMsg(s.val()))}},800);
function sendT(){const i=document.getElementById('h-ci'),t=i.value.trim();if(t){put({t:t.slice(0,120)});i.value=''}}
document.addEventListener('click',e=>{const b=e.target.closest('#h-cb,[data-hr],[data-hs],[data-hb]');if(!b)return;if(b.id=='h-cb'){ch.classList.toggle('on');unread=0;bd.style.display='none'}else if(b.dataset.hr)put({r:b.dataset.hr});else if(b.dataset.hs!==undefined)sendT();else{bots=!bots;render()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='h-ci')sendT()});
// ---- director
let L=-1,N=0,SS='',lastR=0,warD=0,idle=Date.now();
setInterval(()=>{if(!S||S.ph!='auc'||!S.c)return;const c=S.c,p=PL[c.p],now=Date.now(),pn=fn(p.n);
 if(L!=S.i){L=S.i;N=0;SS='bid';warD=0;idle=now;const lot=S.i;setTimeout(()=>{if(S&&L==lot&&S.c&&S.c.st=='bid')scene(f(SC)(pn,p.v))},3200)}
 if(c.st!=SS){SS=c.st;if(c.st=='sold'){const t=S.t[c.by];cr.classList.add('cl');setTimeout(()=>cr.classList.remove('cl'),2200);if(!t.ai&&t.nm&&Math.random()<.8)say(f(RW).replace('{n}',t.nm));else scene(SOLD(pn,fn(t.n)))}else if(c.st=='unsold')scene(UNS(pn))}
 if(c.n>N){N=c.n;idle=now;const t=S.t[c.by];if(t&&!t.ai&&t.nm&&now-lastR>7000&&Math.random()<.55){lastR=now;say(f(RB).replace('{n}',t.nm))}if(N>=6&&!warD&&t){warD=1;scene(WAR(fn(t.n)))}}
 if(c.st=='bid'&&now-idle>13000){idle=now;const hs=S.t.filter(t=>!t.ai&&t.nm&&t!==S.t[c.by]);if(hs.length&&Math.random()<.6)say(f(RI).replace('{n}',f(hs).nm));else scene(f(SC)(pn,p.v))}},400);
const _rh=render;render=function(){_rh();floor();lobBots()};render();
})();
</script>

<!-- ===== PLAYER FACES ADD-ON ===== -->
<style>
.pl .av{width:104px;height:104px;padding:0;overflow:hidden;background:none!important;box-shadow:0 0 0 4px var(--ac),0 6px 14px #0008}
.fc{display:inline-block;width:30px;height:30px;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:6px;box-shadow:0 0 0 2px var(--ac)}
</style>
<script>
(function(){
const h=s=>{let a=7;for(const c of s)a=(a*31+c.charCodeAt(0))>>>0;return a};
const rng=s=>{let a=h(s);return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const SK={IN:['#c68642','#a9703a','#8d5524','#d9a066','#b5773e'],AU:['#f1c27d','#e0ac69','#ffdbac','#d9a066'],GB:['#ffdbac','#f1c27d','#e8b98a'],SA:['#f1c27d','#e0ac69','#c68642','#8d5524'],NZ:['#ffdbac','#e0ac69','#c68642'],WI:['#6b4423','#4a2c17','#8d5524'],AF:['#e0ac69','#c68642','#d9a066'],SL:['#a9703a','#8d5524','#c68642'],BD:['#a9703a','#c68642','#8d5524']};
const HC={IN:['#0d0a08','#1b130e'],AF:['#0d0a08','#2b1d12'],SL:['#0d0a08','#1b130e'],BD:['#0d0a08'],WI:['#0d0a08','#1b130e'],AU:['#5a3a1a','#c9a24a','#2b1d12','#8a5a2b'],GB:['#5a3a1a','#c9a24a','#2b1d12','#8a5a2b','#b5651d'],NZ:['#5a3a1a','#2b1d12','#c9a24a'],SA:['#5a3a1a','#2b1d12','#c9a24a','#0d0a08']};
const JC={IN:'#1e5fd6',AU:'#f2c200',GB:'#c8102e',SA:'#007a4d',NZ:'#15151a',WI:'#7b1e3a',AF:'#1d6fd1',SL:'#1c3f94',BD:'#0b7a3b'};
function face(p){const r=rng(p.n),pk=a=>a[r()*a.length|0],sk=pk(SK[p.c]),hc=pk(HC[p.c]),jc=JC[p.c],st=r()*5|0,bd=r(),bdy=['IN','AF','SL','BD'].includes(p.c)?.5:.35,ey=2.6+r()*1.6,nw=3+r()*3,mw=7+r()*5,hw=21+r()*3,hh=25+r()*3,eb=r()*2,sm=69+r()*3;let hair;
 if(st==0)hair=`<path d="M${50-hw-1} 44C${50-hw} 18 ${50+hw} 18 ${50+hw+1} 44C${50+hw-3} 32 ${50-hw+3} 32 ${50-hw-1} 44Z" fill="${hc}"/>`;
 else if(st==1)hair=`<path d="M${50-hw-1} 46C${50-hw-4} 14 ${50+hw+4} 14 ${50+hw+1} 46C${50+hw-2} 30 60 26 40 30C${50-hw+2} 34 ${50-hw} 40 ${50-hw-1} 46Z" fill="${hc}"/>`;
 else if(st==2)hair=[0,1,2,3,4,5,6].map(i=>`<circle cx="${50-hw+i*(2*hw/6)}" cy="${28-(i%2)*3+Math.abs(3-i)*2}" r="7" fill="${hc}"/>`).join('');
 else if(st==3)hair=`<path d="M${50-hw} 40C${50-hw+2} 26 ${50+hw-2} 26 ${50+hw} 40C${50+hw-6} 34 ${50-hw+6} 34 ${50-hw} 40Z" fill="${hc}"/>`;
 else hair=`<path d="M${50-hw-2} 46C${50-hw-6} 10 ${50+hw+6} 10 ${50+hw+2} 46C${50+hw} 28 ${50-hw} 28 ${50-hw-2} 46Z" fill="${hc}"/><circle cx="50" cy="12" r="6" fill="${hc}"/>`;
 const beard=bd<bdy?`<path d="M${50-hw} 54C${50-hw+2} ${50+hh+6} ${50+hw-2} ${50+hh+6} ${50+hw} 54C${50+hw-6} 62 ${50-hw+6} 62 ${50-hw} 54Z" fill="${hc}" opacity="${bd<bdy/2?.95:.55}"/>`:'';
 return `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><clipPath id="fc"><circle cx="50" cy="50" r="50"/></clipPath><linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f55"/><stop offset="1" stop-color="#14172a"/></linearGradient></defs><g clip-path="url(#fc)"><rect width="100" height="100" fill="url(#fb)"/><path d="M8 100C10 78 30 72 50 72C70 72 90 78 92 100Z" fill="${jc}"/><path d="M40 72L50 84L60 72Z" fill="#fff" opacity=".9"/><rect x="43" y="62" width="14" height="14" rx="5" fill="${sk}"/><circle cx="${50-hw}" cy="50" r="4" fill="${sk}"/><circle cx="${50+hw}" cy="50" r="4" fill="${sk}"/><ellipse cx="50" cy="48" rx="${hw}" ry="${hh}" fill="${sk}"/>${hair}<path d="M36 ${40-eb}L45 39M64 ${40-eb}L55 39" stroke="#2a1a10" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="40" cy="46" rx="${ey+1}" ry="${ey}" fill="#fff"/><ellipse cx="60" cy="46" rx="${ey+1}" ry="${ey}" fill="#fff"/><circle cx="40" cy="46.5" r="1.9" fill="#1a0f08"/><circle cx="60" cy="46.5" r="1.9" fill="#1a0f08"/><path d="M50 48L${50-nw/2} 57Q50 60 ${50+nw/2} 57Z" fill="#000" opacity=".14"/>${beard}<path d="M${50-mw/2} 65Q50 ${sm} ${50+mw/2} 65" stroke="#7a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/></g></svg>`}
window.__hf=i=>face(PL[i]);
const mug=p=>{const u=(window.PLAYER_PHOTOS||{})[p.n.toLowerCase()];return u?`<img src="${u}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML=__hf(${p.i})">`:face(p)};
const BY={};PL.forEach(p=>BY[p.n]=p);
function paint(){
 if(S&&S.c)document.querySelectorAll('.pl .av').forEach(a=>{if(a.dataset.f)return;a.dataset.f=1;a.innerHTML=mug(PL[S.c.p])});
 document.querySelectorAll('.row b').forEach(b=>{const p=BY[b.textContent];if(p&&!b.dataset.f){b.dataset.f=1;b.parentNode.insertAdjacentHTML('afterbegin','<span class="fc">'+mug(p)+'</span>')}})}
const _rf=render;render=function(){_rf();paint()};render();
})();
</script>
